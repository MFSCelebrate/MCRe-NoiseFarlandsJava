name: Build Minecraft 26.2 (Permanent)

on:
  push:
    branches: [ "main", "26.2-Permanent" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 25
  JAVA_DISTRIBUTION: temurin

jobs:
  ArchiveCode:
    name: Archive Source Code
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4.2.2

      - name: 打包当前源代码（含 .github）
        run: |
          echo "📦 正在打包当前源代码（排除构建缓存、jar 等）..."
          zip -r source-current.zip . \
            -x "*.git/*" "build/*" ".gradle/*" "extracted/*" \
               "*.jar" "*.log" "*.bin" "*.lock" "*.iml" ".idea/*"
          echo "✅ 当前源代码打包完成（source-current.zip）"

      - name: 尝试下载上一次构建的源码备份
        id: download_prev
        continue-on-error: true
        uses: actions/download-artifact@v4.2.0
        with:
          name: source-backup
          path: .

      - name: 处理上一次备份文件
        if: steps.download_prev.outcome == 'success'
        run: |
          if [ -f source-backup.zip ]; then
            mv source-backup.zip source-previous.zip
            echo "✅ 成功获取上一次构建的源代码备份"
          else
            echo "⚠️ 下载成功但找不到 source-backup.zip，跳过"
          fi

      - name: 上传当前源码备份（供下一次构建使用）
        uses: actions/upload-artifact@v4.6.0
        with:
          name: source-backup
          path: source-current.zip
          if-no-files-found: error
          retention-days: 7

      - name: 上传本次 & 上次源码归档（供人工查阅）
        uses: actions/upload-artifact@v4.6.0
        with:
          name: SourceBackups-${{ github.run_id }}
          path: |
            source-current.zip
            source-previous.zip
          if-no-files-found: warn
          retention-days: 3
  
  # ===== 测试组：必须在 Build Minecraft 26.2 之前通过 =====
  CheckConfig:
    name: Check Build Config
    runs-on: ubuntu-24.04
    outputs:
      enable_nightly: ${{ steps.read_config.outputs.enable_nightly }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4.2.2
      
      - name: 读取 DebugBuildConfig.properties（Nightly 开关）
        id: read_config
        run: |
          ENABLE=$(grep '^EnableTestNightlyRelease=' DebugBuildConfig.properties | cut -d'=' -f2 || echo "false")
          ENABLE=$(echo "$ENABLE" | tr '[:upper:]' '[:lower:]')
          echo "enable_nightly=$ENABLE" >> $GITHUB_OUTPUT
          echo "ENABLE_NIGHTLY=$ENABLE" >> $GITHUB_ENV
          echo "✅ Nightly Release 开关: $ENABLE"

  # ===== 测试组：必须在 Build Minecraft 26.2 之前通过 =====
  Tests:
    name: BuildTests
    needs: CheckConfig
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4.2.2

      # Test 1：检测 src/main/java 下所有 .java 文件内是否残留 Patch 的 Diff 格式
      - name: Test for No Residual Patch Diff
        run: |
          echo "🧪 [Test 1] 正在检查 src/main/java 下所有 .java 文件是否存在残留 Patch Diff 格式..."
          MATCHES=$(grep -rnE '^\+ |^- ' src/main/java --include='*.java' || true)
          if [ -n "$MATCHES" ]; then
            COUNT=$(echo "$MATCHES" | wc -l)
            echo "❌ 检测到残留 Patch Diff 格式！共 $COUNT 处："
            echo ""
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ 未检测到残留 Patch Diff，检查通过"

  build:
    needs: [Tests, CheckConfig]
    name: Build Minecraft 26.2
    runs-on: ubuntu-24.04
    outputs:
      enable_nightly: ${{ needs.CheckConfig.outputs.enable_nightly }}
      minecraft_version: ${{ steps.read_version.outputs.version }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4.2.2

      - name: 配置 JDK
        uses: actions/setup-java@v4.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: 从 gradle.properties 读取 minecraft_version
        id: read_version
        run: |
          VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          if [ -z "$VERSION" ]; then
            echo "⚠️ 未找到 minecraft_version，使用默认 26.2"
            VERSION="26.2"
          fi
          echo "MINECRAFT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ 读取到 Minecraft 版本: $VERSION"

      - name: 下载原版 Minecraft ${{ env.MINECRAFT_VERSION }} client jar
        run: |
          curl -s -o version_manifest.json https://launchermeta.mojang.com/mc/game/version_manifest.json
          VERSION_URL=$(cat version_manifest.json | jq -r --arg VERSION "${{ env.MINECRAFT_VERSION }}" '.versions[] | select(.id==$VERSION) | .url')
          if [ -z "$VERSION_URL" ]; then
            echo "❌ 未找到版本 ${{ env.MINECRAFT_VERSION }}，尝试使用最新快照..."
            VERSION_URL=$(cat version_manifest.json | jq -r '.latest.snapshot.url')
          fi
          curl -s -o version.json $VERSION_URL
          CLIENT_URL=$(cat version.json | jq -r '.downloads.client.url')
          wget -O original.jar $CLIENT_URL

      - name: 给 gradlew 加执行权限
        run: chmod +x ./gradlew

      - name: 编译并 remap（生成 modified.jar）
        run: |
          ./gradlew clean build --no-daemon 2>&1 | tee full.log
          grep -B 2 -A 5 "error:" full.log > compile_errors.log || true
          rm -f full.log
        continue-on-error: true

      - name: 上传编译错误日志
        uses: actions/upload-artifact@v4.6.0
        with:
          name: CompileErrors
          path: compile_errors.log
          if-no-files-found: warn

      - name: 查看 modified.jar 内容
        if: success()
        run: |
          echo "===== modified.jar 中的类（已去混淆） ====="
          jar tf build/libs/modified.jar | grep -E "\.class$" | head -30

      - name: 解压原版 jar
        if: success()
        run: |
          rm -rf extracted
          mkdir -p extracted
          cd extracted
          jar xf ../original.jar
          cd ..

      - name: 用 modified.jar 覆盖原版
        if: success()
        run: |
          cd extracted
          jar xf ../build/libs/modified.jar
          rm -f META-INF/*.SF META-INF/*.RSA META-INF/*.DSA
          cd ..

      - name: 重新打包完整 jar
        if: success()
        run: |
          cd extracted
          jar cfm ../26.2-Permanent.jar META-INF/MANIFEST.MF .
          cd ..

      - name: 验证关键类
        if: success()
        run: |
          jar tf 26.2-Permanent.jar | grep -E "Minecraft\.class$" || echo "⚠️ 未找到 Minecraft.class，可能类名不同。"
          echo "===== 列出前 20 个类 ====="
          jar tf 26.2-Permanent.jar | grep -E "\.class$" | head -20

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: 26.2-Permanent
          path: 26.2-Permanent.jar
          if-no-files-found: error

      - name: 上传版本 JSON 元数据
        if: success()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: MinecraftVersionJson
          path: MainProjectCatalogue/MinecraftVersionJson/26.2/26.2-Permanent.json
          if-no-files-found: error

      # ========== 构建摘要 ==========
      - name: 生成构建摘要
        if: always()
        run: |
          echo "## 🧪 构建结果摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "build/libs/modified.jar" ]; then
            echo "✅ **构建状态**: 成功" >> $GITHUB_STEP_SUMMARY
            JAR_SIZE=$(du -h build/libs/modified.jar | cut -f1)
            echo "- 📦 **修改后的 jar 大小**: $JAR_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- 🎯 **Minecraft 版本**: ${{ env.MINECRAFT_VERSION }}" >> $GITHUB_STEP_SUMMARY
            echo "- 🔧 **Nightly 开关**: ${{ env.ENABLE_NIGHTLY }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 主要类（前 1 个）" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            jar tf build/libs/modified.jar | grep -E "\.class$" | head -1 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **构建状态**: 失败" >> $GITHUB_STEP_SUMMARY
            echo "> 请查看上传的 `CompileErrors` 工件获取详细错误信息" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📄 编译错误摘要" >> $GITHUB_STEP_SUMMARY
            if [ -f compile_errors.log ]; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              head -20 compile_errors.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "未找到错误日志文件" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏱️ 运行信息" >> $GITHUB_STEP_SUMMARY
          echo "- **触发者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    name: Release the Beta Version
    if: needs.build.outputs.enable_nightly == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.2.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Update release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 🛠 每日构建 Nightly Release
          body: |
            **该每日构建版本 (Nightly Release) 是正在开发测试的版本**，用于发布带有改动的测试版本，由 Github Actions 半自动化发布，便于公开进行改版测试

            > [!WARNING]
            > 该版本携带未测试或正在开发的改动，需要进一步测试  
            > 该测试版仍然使用 [GNU General Public License](./LICENSE) 协议，不允许违反协议的行为

            ### 🧩 主要信息 Main Information
            该版本主要由 **Github Actions** 构建完之后半自动发布，具有不固定的延迟发布，带有测试使用的调试器和测试改动

            - 📀 **构建时间**: 每次 Github Actions 触发构建时，当**构建成功且开启 EnableTestNightlyRelease 配置时**，CI环境会自动上传构建产物到此
            - 📲 **构建目标**: **每日构建版本**用于发布每次的开发测试构建，方便公开下载，满足开发者 / 用户的开发需求，提供开发使用的 MCRe-NoiseFarlandsJava 改版
            - 🔨 **满足需求**: 原本的 Github Actions 不满足在无 Github 账号的情况下下载开发测试版本，在这种情况下需要开发者自己发布测试版，过于麻烦。这样的每日构建完美解决了这个问题
            - 🪤 **测试内容**: 正在进行测试的功能和改动，例如 Vulkan 优化和修复各大 Minecraft 特性~~或者 Bug~~

            ### 🖥 您是否需要使用这个版本
            - **开发者或热心测试的用户** 愿意为项目进行开发 / 测试，我们改版欢迎您贡献每一个更改，每一个问题
            - **正常用户** 只想使用已经测试完毕的改版，可以去使用 [正式版](https://github.com/MFSCelebrate/MCRe-NoiseFarlandsJava/releases)

            ### 🤔 反馈该改版的问题
            如果您在该测试改版的过程中发现了问题，您的 Issue 将极具修复的价值
            > 但是你需要组织好你的语言.png

            ### 🎲 构建产物
            由于该改版目前主要更改均在单一分支测试，极少时会在其他分支进行测试，所以每次的构建产物均会上传到这里来 ~~(懒得进行分离发布了)~~
            
            ### 🚅 快速下载
            可能 Github 原生的下载速度过慢，需要快速下载的请点击下面的链接
            - [这里下载 26.2-Permanent.jar](https://v6.gh-proxy.org/https://github.com/MFSCelebrate/MCRe-NoiseFarlandsJava/releases/download/nightly/26.2-Permanent.jar)
            - [这里下载 26.2-Permanent.json](https://v6.gh-proxy.org/https://github.com/MFSCelebrate/MCRe-NoiseFarlandsJava/releases/download/nightly/26.2-Permanent.json)
            
            - CDN 线路: 
               - [26.2-Permanent.jar](https://cdn.gh-proxy.org/https://github.com/MFSCelebrate/MCRe-NoiseFarlandsJava/releases/download/nightly/26.2-Permanent.jar)
               - [26.2-Permanent.json](https://cdn.gh-proxy.org/https://github.com/MFSCelebrate/MCRe-NoiseFarlandsJava/releases/download/nightly/26.2-Permanent.json)
          files: |
            artifacts/26.2-Permanent.jar
            artifacts/26.2-Permanent.json

      # ========== 发布摘要 ==========
      - name: 生成发布摘要
        if: always()
        run: |
          echo "## 📢 发布摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Release 信息" >> $GITHUB_STEP_SUMMARY
          echo "- **标签**: nightly" >> $GITHUB_STEP_SUMMARY
          echo "- **名称**: 🛠 每日构建 Nightly Release" >> $GITHUB_STEP_SUMMARY
          echo "- **构建版本**: ${{ needs.build.outputs.minecraft_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Nightly 开关**: ${{ needs.build.outputs.enable_nightly }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "artifacts/26.2-Permanent.jar" ]; then
            JAR_SIZE=$(du -h artifacts/26.2-Permanent.jar | cut -f1)
            echo "✅ **发布产物**: 已上传 `26.2-Permanent.jar` ($JAR_SIZE)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> 可以在 [Releases](https://github.com/${{ github.repository }}/releases/tag/nightly) 页面下载" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **发布产物**: 未找到 `26.2-Permanent.jar`，发布可能失败" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "artifacts/26.2-Permanent.json" ]; then
            echo "- 📄 **版本元数据**: `26.2-Permanent.json` 已同步上传" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **版本元数据**: 未找到 `26.2-Permanent.json`，请检查构建步骤" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏱️ 运行信息" >> $GITHUB_STEP_SUMMARY
          echo "- **触发者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup artifacts (only on success)
        uses: geekyeggo/delete-artifact@v5
        if: success()
        with:
          name: 26.2-*
          
  # 同步 Wiki 的任务
  sync-wiki:
    continue-on-error: true
    needs: build
    name: Upload Wiki File
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - id: wiki_sync
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: MainProjectCatalogue/GithubWiki

      # ========== Wiki 同步摘要 ==========
      - name: 生成 Wiki 同步摘要
        if: always()
        run: |
          echo "## 📚 Wiki 同步摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        
          echo "### ✅ 同步状态" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.wiki_sync.outcome }}" == "success" ]; then
            echo "- **状态**: 成功 🎉" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **状态**: 失败 ❌" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **源文件夹**: \`MainProjectCatalogue/GithubWiki\`" >> $GITHUB_STEP_SUMMARY
          echo "- **目标 Wiki 仓库**: \`${{ github.repository }}.wiki.git\`" >> $GITHUB_STEP_SUMMARY
          echo "- **触发提交**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        
          echo "### 📄 同步的文件列表" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la MainProjectCatalogue/GithubWiki/ 2>/dev/null || echo "（文件夹不存在或为空）" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔗 访问 Wiki" >> $GITHUB_STEP_SUMMARY
          echo "> 本次同步已将源文件夹内容推送至 Wiki 仓库，可在 [Wiki 页面](https://github.com/${{ github.repository }}/wiki) 立即查看。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 若 Wiki 页面未及时更新，请手动刷新或稍等片刻（GitHub 缓存约 1~2 分钟）。" >> $GITHUB_STEP_SUMMARY