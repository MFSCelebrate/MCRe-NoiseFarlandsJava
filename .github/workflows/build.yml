name: Decompile Beta 1.8.1 with MCP 4.4

on:
  push:
    branches: [ "MCBeta-1.8.1" ]
  workflow_dispatch:  # 建议手动触发，方便测试

jobs:
  build:
    runs-on: ubuntu-latest
    # 核心改动：直接在 Ubuntu 20.04 容器里运行，避开 24.04 的软件源问题
    container: ubuntu:20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 在容器内安装 Java 8 和 Python 2（20.04 源里都有）
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y openjdk-8-jdk python2 wget

    # 运行反编译（容器内 python2 命令可直接用）
    - name: Run MCP Decompile
      working-directory: ./mcp
      run: |
        python2 runtime/decompile.py

    # 上传产物（使用 v4，避免弃用警告）
    - name: Upload generated sources
      uses: actions/upload-artifact@v4
      with:
        name: beta1.8.1-decompiled-src
        path: ./mcp/