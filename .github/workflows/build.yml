name: Decompile Beta 1.8.1 with MCP 4.4

on:
  push:
    branches: [ "MCBeta-1.8.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # 不再用 20.04，直接上最新版，利用海量算力

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Java 8
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '8'

    # 关键改动：在 Ubuntu 22.04/24.04 上安装 Python 2.7
    - name: Install Python 2.7
      run: |
        sudo apt-get update
        sudo apt-get install -y python2

    - name: Run MCP Decompile
      working-directory: ./mcp
      run: |
        # 注意：这里可能要用 python2 而不是 python2.7
        python2 runtime/decompile.py

    - name: Upload generated sources
      uses: actions/upload-artifact@v4
      with:
        name: mcp-decompiled-src
        path: ./mcp/