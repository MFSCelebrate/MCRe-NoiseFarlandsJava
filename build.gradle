// ===== 修改：Java 版本升级到 25 =====
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
    options.compilerArgs << '-Xmaxwarns' << '0'
    options.fork = true
    options.forkOptions.jvmArgs = ['-Xmx4G']
    // ===== 修改：显式指定 source/target 为 25（覆盖默认） =====
    options.compilerArgs += [
        '-source', '25',
        '-target', '25',
        '-Xlint:-unchecked',
        '-Xlint:-rawtypes',
        '-Xlint:-deprecation',
        '-parameters'
     //    '--add-modules', 'java.xml.ws.annotation'   // ← 关键行
    ]
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// brokenPatterns 排除列表保持不变（这些是你已修复的文件）
def brokenPatterns = [
'net/minecraft/util/valueproviders/**',
'net/minecraft/util/datafix/**',



'com/mojang/authlib/services/request/AbuseReportRequest.java',
'com/mojang/authlib/services/request/UserAttributesRequest.java',
'com/mojang/authlib/services/response/UserAttributesResponse.java',
'com/mojang/datafixers/FieldFinder.java',
'com/mojang/datafixers/NamedChoiceFinder.java',
'com/mojang/datafixers/Typed.java',
'com/mojang/datafixers/functions/PointFreeRule.java',
'com/mojang/datafixers/optics/Affine.java',
'com/mojang/datafixers/optics/Optic.java',
'com/mojang/datafixers/optics/Procompose.java',
'com/mojang/datafixers/optics/ReForgetC.java',
'com/mojang/datafixers/optics/ReForgetEP.java',
'com/mojang/datafixers/optics/profunctors/TraversalP.java',
'com/mojang/datafixers/types/templates/TaggedChoice.java',
'com/mojang/datafixers/util/Either.java',
'com/mojang/realmsclient/client/FileDownload.java',
'com/mojang/serialization/Dynamic.java',
'net/minecraft/client/renderer/blockentity/BeaconRenderer.java'
]

sourceSets {
    main {
        java {
            include 'net/minecraft/**'
            
            include 'com/mojang/**'
            
            brokenPatterns.each { pattern -> exclude pattern }
        }
        resources {
            srcDirs = ['src/main/resources']
            include '**'
        }
    }
}

// ===== 修改：remapJar 仍可保留，但 targetNamespace 已是 official（无需转换） =====
// 使用标准的 jar 任务，打包编译后的类
tasks.jar {
    archiveFileName.set('modified.jar')        // 输出文件名
    manifest {
        attributes 'Main-Class': 'net.minecraft.client.main.Main'
    }
    // 如果你只想包含部分 class，可以设置 include/exclude
    // 默认会打包所有编译后的 class
}

// build 任务默认已经依赖 jar，所以我们不需要额外指定
// 如果你希望 build 直接生成最终 jar，可以保留依赖
tasks.build {
    dependsOn tasks.jar
}