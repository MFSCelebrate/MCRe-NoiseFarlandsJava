sourceSets {
    main {
        java {
            include 'net/minecraft/**'
            include 'com/mojang/blaze3d/**'
            include 'com/mojang/realmsclient/**'
            include 'com/mojang/renderpearl/**'
            include 'com/mojang/math/**'
            
            brokenPatterns.each { pattern -> exclude pattern }
        }
        resources {
            srcDirs = ['src/main/resources']
            include '**'
        }
    }
}

// ===== 修改：remapJar 仍可保留，但 targetNamespace 已是 official（无需转换） =====
// 使用标准的 jar 任务，打包编译后的类
tasks.jar {
    archiveFileName.set('modified.jar')        // 输出文件名
    manifest {
        attributes 'Main-Class': 'net.minecraft.client.main.Main'
    }
    // 如果你只想包含部分 class，可以设置 include/exclude
    // 默认会打包所有编译后的 class
}

// build 任务默认已经依赖 jar，所以我们不需要额外指定
// 如果你希望 build 直接生成最终 jar，可以保留依赖
tasks.build {
    dependsOn tasks.jar
}