// ===== 合体版：Loom + Shadow + Toolchain =====
plugins {
    id 'java'
    id 'application'
    id 'net.fabricmc.fabric-loom' version '1.17.9'
    
}

group = 'net.minecraft'
version = '26.2'

// ===== 修改：使用 Toolchain 自动定位 Java 25（吸取项目 B 优点） =====
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // 如果源文件里有 Java 25 新语法，这一步就够了
}

application {
    mainClass = 'net.minecraft.client.main.Main'
    applicationDefaultJvmArgs = [
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.text=ALL-UNNAMED',
        '--add-opens', 'java.desktop/java.awt=ALL-UNNAMED',
        '--add-opens', 'java.desktop/java.awt.image=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.security.util=ALL-UNNAMED',
        '-Djava.library.path=natives'
    ]
}

// ===== 🔧 MCRe：向量化路线（2026-11-15）—— jdk.incubator.vector 孵化模块 =====
// 编译期必须显式 --add-modules；运行时玩家侧由 version.json 的 javaArgs 追加（启动器可自动构造）。
// 未加该参数时 VectorMath 会反射加载失败并自动退回标量 fallback（游戏不受影响）。
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

loom {
    runs {
        client {
            // 项目直接编译游戏源码，入口使用 Main；Loom 仍负责资源下载和开发启动参数。
            mainClass.set(application.mainClass)
            displayName.set('MCRe NoiseFarlandsJava Client')
            runDirectory.set(layout.projectDirectory.dir('run'))
            programArguments.addAll(
                '--version', project.minecraft_version,
                '--accessToken', '0',
                '--username', providers.gradleProperty('clientUsername').orElse('Developer').get(),
                '--offlineDeveloperMode'
            )
            // 当前原生库从 runtimeClasspath 的 jar 中自行解压，不使用 application 的相对 natives 路径。
            jvmArguments.addAll(application.applicationDefaultJvmArgs.findAll {
                !it.startsWith('-Djava.library.path=')
            })
            jvmArguments.add('-Xmx4G')
            // 🔧 向量化：开发环境运行时启用 jdk.incubator.vector（缺失时库自动退回标量）
            jvmArguments.add('--add-modules=jdk.incubator.vector')
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://maven.fabricmc.net/' } // Loom 需要
    maven { url 'https://maven.minecraftforge.net/' }   // ← 加这一行
}

// 🔧 2026-11-17：FreeType 漏洞（minecraft2shell / SHZ 越界写）—— 编译期保持 LWJGL 3.4.1（= MC 26.2 官方配套）
//    · 为什么不是 3.4.3：Loom 从 Mojang 仓库解析 MC 依赖，而 `lwjgl-<ver>-unsafe.jar` **只有 3.4.1 被托管**
//      （3.4.2/3.4.3 均 404）→ 用 3.4.3 会让 CI 在配置期就挂：
//      "Could not find lwjgl-3.4.3-unsafe.jar ... Searched in: https://libraries.minecraft.net/..."
//    · 用户运行时的 native 由**启动器元数据**决定（MainProjectCatalogue/MinecraftVersionJson/26.2/26.2-Permanent.json）
//      → 那里已对齐官方 26.2：freetype = 3.4.1-mojang-2.15.0.3（修复版 FreeType 2.15.0），其余模块 3.4.1
def lwjglVersion = '3.4.1'
def nettyVersion = '4.2.15.Final'
def webrtcVersion = '0.14.0'  // dev.onvoid.webrtc version

ext {
    spi_version = '8.0.0'
}

// ===== 🔧 MCRe 功能测试源集（2026-11-17）=====
// ⚠️ 必须声明在 dependencies 块**之前**：Gradle 是在创建源集时才生成
// functestImplementation / functestRuntimeOnly 这两个 configuration，
// 写在 dependencies 之后会报 "Could not find method functestImplementation()"。
sourceSets {
    // 功能测试根：src-functest/test —— 依赖 Minecraft 类（可能要 Bootstrap + 资源）
    // → 独立源集 + 独立 task（functest），**不挂进 build**：功能测试失败不该拖垮产物构建
    functest {
        java {
            srcDirs = ['src-functest/test']
            include '**'
        }
        resources {
            srcDirs = ['src-functest/resources']
            include '**'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // ===== Mojang 原生库 =====
    implementation 'net.minecraftforge:forgespi:' + spi_version
    implementation "com.mojang:authlib:10.0.76"
    implementation "com.mojang:brigadier:1.3.10"
    implementation "com.mojang:datafixerupper:10.0.21"
    implementation "com.mojang:logging:1.7.12"
    implementation "com.mojang:blocklist:1.0.10"
    implementation "com.mojang:jtracy:1.0.37"
    implementation "com.mojang:text2speech:1.19.12"
    implementation "com.mojang:patchy:2.2.10"

    // ===== P2P / WebRTC 依赖 (from 26.2 Snapshot 8 version.json) =====
    // Group ID is dev.onvoid.webrtc, artifact is webrtc-java
    implementation "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
    // Platform-specific natives (these are the actual artifacts in libraries.minecraft.net per version.json)
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:windows-x86_64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:macos-x86_64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:macos-aarch64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:linux-x86_64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:linux-aarch64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:linux-aarch32"

    implementation "com.google.guava:guava:33.6.0-jre"
    implementation "com.google.guava:failureaccess:1.0.3"
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "com.ibm.icu:icu4j:78.3"
    implementation "com.microsoft.azure:msal4j:1.24.1"
    implementation "com.azure:azure-json:1.4.0"
    implementation "net.java.dev.jna:jna:5.17.0"
    implementation "net.java.dev.jna:jna-platform:5.17.0"

    implementation "io.netty:netty-buffer:${nettyVersion}"
    implementation "io.netty:netty-codec:${nettyVersion}"
    implementation "io.netty:netty-codec-base:${nettyVersion}"
    implementation "io.netty:netty-codec-compression:${nettyVersion}"
    implementation "io.netty:netty-codec-http:${nettyVersion}"
    implementation "io.netty:netty-common:${nettyVersion}"
    implementation "io.netty:netty-handler:${nettyVersion}"
    implementation "io.netty:netty-resolver:${nettyVersion}"
    implementation "io.netty:netty-transport:${nettyVersion}"
    implementation "io.netty:netty-transport-classes-epoll:${nettyVersion}"
    implementation "io.netty:netty-transport-classes-kqueue:${nettyVersion}"
    implementation "io.netty:netty-transport-native-unix-common:${nettyVersion}"

    implementation "it.unimi.dsi:fastutil:8.5.18"
    implementation "net.sf.jopt-simple:jopt-simple:5.0.4"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation "commons-io:commons-io:2.20.0"
    implementation "commons-codec:commons-codec:1.22.0"
    implementation "org.joml:joml:1.10.8"
    implementation "org.jspecify:jspecify:1.0.0"
    implementation "at.yawk.lz4:lz4-java:1.10.1"
    implementation "ca.weblite:java-objc-bridge:1.1"
    implementation "com.github.oshi:oshi-core:6.9.0"
    implementation "org.jcraft:jorbis:0.0.17"
    implementation "org.jetbrains:annotations:26.0.2"

    implementation "org.slf4j:slf4j-api:2.0.17"
    implementation "org.apache.logging.log4j:log4j-api:2.26.0"
    implementation "org.apache.logging.log4j:log4j-core:2.26.0"
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0"

    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl:${lwjglVersion}:unsafe"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-openal:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-stb:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-freetype:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-shaderc:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-spvc:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-vma:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-jemalloc:${lwjglVersion}"

    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-openal:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-freetype:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-shaderc:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-spvc:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-vma:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-jemalloc:${lwjglVersion}:natives-windows"

    // ===== 🔧 MCRe 测试体系（2026-11-17）=====
    // 单元测试（src-unittest/test）：纯逻辑，不依赖 Minecraft 运行时 → 进标准 test 源集
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 功能测试（src-functest/test）：依赖 Minecraft 类 / 需要 Bootstrap 与资源 → 独立源集 + 独立 task
    functestImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
    functestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def brokenPatterns = ["**/*.bak"]

// ===== 🔧 MCRe：多源根布局（2026-11-16）=====
// 主代码与第三方依赖库分根存放，每个根内部都镜像包名（root/包路径/文件），
// 这样 javac -sourcepath 的隐式查找、Gradle 增量编译、IDE 索引都能正常工作。
sourceSets {
    main {
        java {
            // Minecraft 主代码（vanilla + 我们就地改的 + MCRe 自研 net/MinecraftTools 等）
            srcDirs = ['src/common']
            // 第三方依赖库源码（各自独立成根，便于与主代码区分）
            srcDirs += ['src-deps/Core']
            // 开发测试库源码（仍然独立成根）
            srcDirs += ['src-testinfrastructure/common']
            include '**'
            brokenPatterns.each { pattern -> exclude pattern }
        }
        resources {
            srcDirs = ['src/resources']
            include '**'
        }
    }

    // ===== 🔧 MCRe 测试体系（2026-11-17）=====
    // 单元测试根：src-unittest/test —— 纯逻辑（不依赖 Minecraft 运行时），秒级、无需资源
    // → 进标准 test 源集 → 每次 gradle build 自动跑（:test 不再是 NO-SOURCE）
    test {
        java {
            srcDirs = ['src-unittest/test']
            include '**'
        }
        resources {
            srcDirs = ['src-unittest/resources']
            include '**'
        }
    }
}

// 自定义源集**不会**继承 main 的依赖与产物 → 手工挂上（⚠️ 两样都要，缺一不可）：
//   ① main.output —— main 源集**自己编译出来的 class**（net.minecraft.* / net.MinecraftTools.* / test.DebugAssertions.*）
//      ⚠️ 坑：Gradle 的 sourceSets.X.compileClasspath **只含依赖 jar，不含 output**！
//      只挂 compileClasspath 的后果：functest 只能看见 vanilla 的 MC jar → 报
//      "cannot find symbol: class MathUtil / location: package net.minecraft.util"（包在、类不在，极具迷惑性）
//   ② main.compileClasspath —— main 的第三方依赖（否则 javac 报
//      "unknown enum constant Dist.CLIENT（class file for net.minecraftforge.api.distmarker.Dist not found）"）
sourceSets.functest.compileClasspath += sourceSets.main.output
sourceSets.functest.compileClasspath += sourceSets.main.compileClasspath
sourceSets.functest.runtimeClasspath += sourceSets.main.output
sourceSets.functest.runtimeClasspath += sourceSets.main.runtimeClasspath

// ===== 🔧 MCRe 测试体系（2026-11-17）=====
// 单元测试：走 JUnit 5 平台（类名 *UnitTests 会被 Gradle 默认的 test 扫描命中）
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// 功能测试：独立 task，**不参与 build**（避免功能测试失败导致产物构建失败）
tasks.register('functest', Test) {
    description = '运行 MCRe 功能测试（依赖 Minecraft 运行时；不参与 build）'
    group = 'verification'
    testClassesDirs = sourceSets.functest.output.classesDirs
    classpath = sourceSets.functest.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    shouldRunAfter tasks.named('test')
}

// build 顺带**编译**功能测试（但不执行）→ functest 的编译错误能在 CI 被发现，
// 而 functest 的**运行**仍需显式 `./gradlew functest`（避免功能测试失败拖垮产物构建）
tasks.named('build') {
    dependsOn 'functestClasses'
}

// ===== 修改：在编译前自动更新 ModMetadata 的 BUILD_TIME =====
tasks.register('updateBuildTime') {
    description = '将 ModMetadata.java 中的 BUILD_TIME 更新为当前 UTC 时间'
    doLast {
        def targetFile = file('src/common/net/ModMetadata/ModMetadata.java')
        if (!targetFile.exists()) {
            logger.warn('⚠️ ModMetadata.java 不存在，跳过构建时间更新')
            return
        }

        // 读取当前文件内容
        def content = targetFile.text

        // 匹配 ZonedDateTime.parse("任意内容") 
        // 注意：原格式是 "2026-06-16T12:01:27+00:00"，我们用正则替换引号内的部分

        def currentTime = java.time.ZonedDateTime.now(java.time.ZoneOffset.UTC).toString()
        // 示例输出：2026-08-03T10:00:00Z（Z 表示 UTC，ZonedDateTime.parse 完全支持）

        // 正则：查找 ZonedDateTime.parse("...") 并替换为新的时间
        def pattern = ~/ZonedDateTime\.parse\("[^"]*"\)/
        if (content.find(pattern)) {
            content = content.replaceAll(pattern, "ZonedDateTime.parse(\"${currentTime}\")")
            targetFile.text = content
            logger.lifecycle("✅ 已更新 BUILD_TIME 为: ${currentTime}")
        } else {
            logger.warn("⚠️ 未找到 ZonedDateTime.parse(\"...\") 模式，请检查 ModMetadata.java 格式")
        }
    }
}

// 让编译任务依赖于更新任务
tasks.named('compileJava').configure {
    dependsOn 'updateBuildTime'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // ===== 关键：开启全量调试信息 =====
    // source : 保留源文件名 (SourceFile 属性)
    // lines  : 保留行号表 (LineNumberTable 属性)
    // vars   : 保留局部变量表 (LocalVariableTable / LocalVariableTypeTable 属性)
    options.debug = true
    options.debugOptions.debugLevel = "source,lines,vars"

    options.compilerArgs += [
        // 等价于上面 debugLevel 的显式写法，双保险（Gradle 与 javac 版本差异时也生效）
        '-g:source,lines,vars',

        // 保留方法参数名（Java 8+，用于反射/框架）
        '-parameters',

        // 保留注解处理信息
        '-Xlint:processing',
        '-Xmaxerrs', '10000',
        '-Xmaxwarns', '0',
        '-Xlint:-unchecked',
        '-Xlint:-rawtypes',
        '-Xlint:-deprecation',

        // 尽量保留泛型签名（javac 默认写入 Signature 属性，这里显式声明不剥离）
        // 注意：泛型擦除只发生在类型系统层面，Signature 属性本身由 javac 自动生成

        '--add-exports', 'java.base/sun.security.util=ALL-UNNAMED',
        '--add-exports', 'java.desktop/com.sun.imageio.plugins.png=ALL-UNNAMED'
    ]

    // 编译时开启断言信息（class 中的 <clinit> 会带上 assert 检查，不会剥离）
    options.compilerArgs += ['-Averbose=true']

    options.fork = true
    options.forkOptions.jvmArgs = ['-Xmx4G']

    // 保留 Java 源文件与字节码的映射，不进行任何源码级优化
    // javac 本身不做混淆/裁剪，所以这里不需要额外开关，
    // 只需保证后续打包/混淆步骤不剥离属性
}

// ===== 修改：让 build 依赖 Jar =====
tasks.named('build') {
     dependsOn tasks.jar //tasks.named('shadowJar')
}

// 保留普通 jar 任务（用于调试，但不作为主输出）
tasks.named('jar') {
    archiveFileName.set('modified.jar')
    manifest {
        attributes(
            'Main-Class': 'net.minecraft.client.main.Main',
            'Multi-Release': 'true'
        )
    }
}
