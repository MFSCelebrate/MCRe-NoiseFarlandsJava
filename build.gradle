// ===== 修改：插件 ID 升级为官方新格式 =====
plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17.9'
    id 'com.github.johnrengelman.shadow' version '8.1.1'   // 新增
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

