// ===== 合体版：Loom + Shadow + Toolchain =====
plugins {
    id 'java'
    id 'application'
    id 'net.fabricmc.fabric-loom' version '1.17.9'
    
}

group = 'net.minecraft'
version = '26.2'

// ===== 修改：使用 Toolchain 自动定位 Java 25（吸取项目 B 优点） =====
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // 如果源文件里有 Java 25 新语法，这一步就够了
}

application {
    mainClass = 'net.minecraft.client.main.Main'
    applicationDefaultJvmArgs = [
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.text=ALL-UNNAMED',
        '--add-opens', 'java.desktop/java.awt=ALL-UNNAMED',
        '--add-opens', 'java.desktop/java.awt.image=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.security.util=ALL-UNNAMED',
        '-Djava.library.path=natives'
    ]
}

repositories {
    mavenCentral()
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://maven.fabricmc.net/' } // Loom 需要
    maven { url 'https://maven.minecraftforge.net/' }   // ← 加这一行
}

def lwjglVersion = '3.4.1'
def nettyVersion = '4.2.15.Final'
def webrtcVersion = '0.14.0'  // dev.onvoid.webrtc version

ext {
    spi_version = '8.0.0'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // ===== Mojang 原生库 =====
    implementation 'net.minecraftforge:forgespi:' + spi_version
    implementation "com.mojang:authlib:10.0.76"
    implementation "com.mojang:brigadier:1.3.10"
    implementation "com.mojang:datafixerupper:10.0.21"
    implementation "com.mojang:logging:1.7.12"
    implementation "com.mojang:blocklist:1.0.10"
    implementation "com.mojang:jtracy:1.0.37"
    implementation "com.mojang:text2speech:1.19.12"
    implementation "com.mojang:patchy:2.2.10"

    // ===== P2P / WebRTC 依赖 (from 26.2 Snapshot 8 version.json) =====
    // Group ID is dev.onvoid.webrtc, artifact is webrtc-java
    implementation "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
    // Platform-specific natives (these are the actual artifacts in libraries.minecraft.net per version.json)
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:windows-x86_64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:macos-x86_64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:macos-aarch64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:linux-x86_64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:linux-aarch64"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:linux-aarch32"

    implementation "com.google.guava:guava:33.6.0-jre"
