// ===== 合体版：Loom + Shadow + Toolchain =====
plugins {
    id 'java'
    id 'application'
    id 'net.fabricmc.fabric-loom' version '1.17.9'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'net.minecraft'
version = '26.3-snapshot-3'

// ===== 修改：使用 Toolchain 自动定位 Java 25（吸取项目 B 优点） =====
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // 如果源文件里有 Java 25 新语法，这一步就够了
}

application {
    mainClass = 'net.minecraft.client.main.Main'
    applicationDefaultJvmArgs = [
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.text=ALL-UNNAMED',
        '--add-opens', 'java.desktop/java.awt=ALL-UNNAMED',
        '--add-opens', 'java.desktop/java.awt.image=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.security.util=ALL-UNNAMED',
        '-Djava.library.path=natives'
    ]
}

repositories {
    mavenCentral()
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://maven.fabricmc.net/' } // Loom 需要
}

def lwjglVersion = '3.4.1'
def nettyVersion = '4.2.15.Final'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // ===== 你原有的 131 个库（略，保持你提供的列表） =====
    implementation "com.mojang:authlib:10.0.76"
    implementation "com.mojang:brigadier:1.3.10"
    implementation "com.mojang:datafixerupper:10.0.21"
    implementation "com.mojang:logging:1.7.12"
    implementation "com.mojang:blocklist:1.0.10"
    implementation "com.mojang:jtracy:1.0.37"
    implementation "com.mojang:text2speech:1.19.12"
    implementation "com.mojang:patchy:2.2.10"

    implementation "com.google.guava:guava:33.6.0-jre"
    implementation "com.google.guava:failureaccess:1.0.3"
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "com.ibm.icu:icu4j:78.3"
    implementation "com.microsoft.azure:msal4j:1.24.1"
    implementation "com.azure:azure-json:1.4.0"
    implementation "net.java.dev.jna:jna:5.17.0"
    implementation "net.java.dev.jna:jna-platform:5.17.0"

    implementation "io.netty:netty-buffer:${nettyVersion}"
    implementation "io.netty:netty-codec:${nettyVersion}"
    implementation "io.netty:netty-codec-base:${nettyVersion}"
    implementation "io.netty:netty-codec-compression:${nettyVersion}"
    implementation "io.netty:netty-codec-http:${nettyVersion}"
    implementation "io.netty:netty-common:${nettyVersion}"
    implementation "io.netty:netty-handler:${nettyVersion}"
    implementation "io.netty:netty-resolver:${nettyVersion}"
    implementation "io.netty:netty-transport:${nettyVersion}"
    implementation "io.netty:netty-transport-classes-epoll:${nettyVersion}"
    implementation "io.netty:netty-transport-classes-kqueue:${nettyVersion}"
    implementation "io.netty:netty-transport-native-unix-common:${nettyVersion}"

    implementation "it.unimi.dsi:fastutil:8.5.18"
    implementation "net.sf.jopt-simple:jopt-simple:5.0.4"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation "commons-io:commons-io:2.20.0"
    implementation "commons-codec:commons-codec:1.22.0"
    implementation "org.joml:joml:1.10.8"
    implementation "org.jspecify:jspecify:1.0.0"
    implementation "at.yawk.lz4:lz4-java:1.10.1"
    implementation "ca.weblite:java-objc-bridge:1.1"
    implementation "com.github.oshi:oshi-core:6.9.0"
    implementation "org.jcraft:jorbis:0.0.17"
    implementation "org.jetbrains:annotations:26.0.2"

    implementation "org.slf4j:slf4j-api:2.0.17"
    implementation "org.apache.logging.log4j:log4j-api:2.26.0"
    implementation "org.apache.logging.log4j:log4j-core:2.26.0"
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0"

    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl:${lwjglVersion}:unsafe"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-openal:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-stb:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-freetype:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-shaderc:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-spvc:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-vma:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-jemalloc:${lwjglVersion}"

    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-openal:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-freetype:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-shaderc:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-spvc:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-vma:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-jemalloc:${lwjglVersion}:natives-windows"
}

def brokenPatterns = []

sourceSets {
    main {
        java {
            include 'net/minecraft/**'
            include 'com/mojang/**'
            
            brokenPatterns.each { pattern -> exclude pattern }
        }
        resources {
            srcDirs = ['src/main/resources']
            include '**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-Xmaxerrs', '10000',
        '-Xmaxwarns', '0',
        '-Xlint:-unchecked',
        '-Xlint:-rawtypes',
        '-Xlint:-deprecation',
        '-parameters',
        '--add-exports', 'java.base/sun.security.util=ALL-UNNAMED',
        '--add-exports', 'java.desktop/com.sun.imageio.plugins.png=ALL-UNNAMED'
    ]
    options.fork = true
    options.forkOptions.jvmArgs = ['-Xmx4G']
}

// ===== 修改：关键！补上 ShadowJar 配置（你的原版漏了） =====
shadowJar {
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    archiveFileName.set('modified.jar')  // 用回霸气名字
    manifest {
        attributes(
            'Main-Class': 'net.minecraft.client.main.Main',
            'Multi-Release': 'true'
        )
    }
    mergeServiceFiles()   // 处理 META-INF/services
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA' // 签名去重
}

// ===== 修改：让 build 依赖 shadowJar，而不是直接覆盖 jar =====
tasks.named('build') {
     dependsOn tasks.jar //tasks.named('shadowJar')
}

// 保留普通 jar 任务（用于调试，但不作为主输出）
tasks.named('jar') {
    archiveFileName.set('modified.jar')
    manifest {
        attributes(
            'Main-Class': 'net.minecraft.client.main.Main',
            'Multi-Release': 'true'
        )
    }
}